openapi: 3.0.0
info:
  title: Antigravity Enterprise API
  version: 1.0.0
  description: Single-tenant Clean API
paths:
  /api/users/profile:
    get:
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile details
        401:
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
