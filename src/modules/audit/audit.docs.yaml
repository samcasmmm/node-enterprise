tags:
  - name: Audit
    description: Audit log viewer — read-only logging and compliance trail

paths:
  /audit:
    get:
      tags: [Audit]
      summary: List audit logs (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Audit logs fetched
          content:
            application/json:
              example:
                success: true
                message: Audit logs fetched.
                module: audit
                data:
                  - id: 1
                    tenantId: 1
                    actorUserId: 1
                    action: USER_CREATED
                    entityType: user
                    entityId: '2'
                    ipAddress: 192.168.1.10
                    createdAt: '2026-07-25T20:18:00.000Z'
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
                timestamp: '2026-07-25 20:18:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /audit/{id}:
    get:
      tags: [Audit]
      summary: Get audit log entry by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Audit log details
          content:
            application/json:
              example:
                success: true
                message: Audit log details.
                module: audit
                data:
                  id: 1
                  tenantId: 1
                  actorUserId: 1
                  action: USER_CREATED
                  entityType: user
                  entityId: '2'
                  ipAddress: 192.168.1.10
                  createdAt: '2026-07-25T20:18:00.000Z'
                timestamp: '2026-07-25 20:18:00'
        '404':
          $ref: '#/components/responses/404NotFoundError'
