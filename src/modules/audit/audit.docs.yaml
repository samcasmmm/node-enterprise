tags:
  - name: Audit
    description: Audit log viewer — read-only access

paths:
  /audit:
    get:
      tags: [Audit]
      summary: List audit logs (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Audit logs fetched.

  /audit/{id}:
    get:
      tags: [Audit]
      summary: Get audit log entry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Audit log details.
