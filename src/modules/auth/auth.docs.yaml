tags:
  - name: Auth
    description: Authentication — register-tenant, login, logout, token refresh, OTP, MFA, devices

paths:
  /auth/register-tenant:
    post:
      tags: [Auth]
      summary: Onboarding — Register new company & tenant owner
      description: Single-step SaaS onboarding. Auto-provisions Tenant, User, Owner/SUPER_ADMIN role, default departments, and workspace settings inside an atomic database transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, companyName, email, password]
              properties:
                name:
                  type: string
                  example: Jane Doe
                companyName:
                  type: string
                  example: Acme Technologies Inc
                email:
                  type: string
                  format: email
                  example: jane.doe@acme-technologies.com
                password:
                  type: string
                  minLength: 8
                  example: P@ssw0rd2026!
                phone:
                  type: string
                  example: '+15550192834'
                country:
                  type: string
                  example: US
                language:
                  type: string
                  default: en
                  example: en
      responses:
        '201':
          description: Tenant and administrator account created successfully
          content:
            application/json:
              example:
                success: true
                message: Tenant and administrator account created successfully.
                module: auth
                data:
                  user:
                    id: 1
                    name: Jane Doe
                    email: jane.doe@acme-technologies.com
                  tenant:
                    id: 1
                    name: Acme Technologies Inc
                    slug: acme-technologies-inc
                    status: trial
                  roles:
                    - id: 1
                      name: SUPER_ADMIN
                  permissions:
                    - '*'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsInRlbmFudElkIjoxfQ.example_token
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.example_refresh_token
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user under an existing tenant
      description: Creates a user account linked to an existing tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                tenantId:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Robert Smith
                email:
                  type: string
                  format: email
                  example: robert@acme-technologies.com
                password:
                  type: string
                  minLength: 8
                  example: UserPass2026!
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              example:
                success: true
                message: Account created.
                module: auth
                data:
                  id: 2
                  email: robert@acme-technologies.com
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user & issue tokens
      description: Authenticates user credentials by email across tenants. Does not require manual Tenant ID entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: jane.doe@acme-technologies.com
                password:
                  type: string
                  example: P@ssw0rd2026!
                deviceFingerprint:
                  type: string
                  example: fp_macbook_pro_m2_99218
                deviceName:
                  type: string
                  example: Jane's MacBook Pro
                platform:
                  type: string
                  example: macOS 14.5
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: Login successful.
                module: auth
                data:
                  user:
                    id: 1
                    name: Jane Doe
                    email: jane.doe@acme-technologies.com
                    tenantId: 1
                  tenant:
                    id: 1
                    name: Acme Technologies Inc
                    slug: acme-technologies-inc
                    status: trial
                  roles:
                    - id: 1
                      name: SUPER_ADMIN
                  permissions:
                    - '*'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsInRlbmFudElkIjoxfQ.example_access_token
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.example_refresh_token
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.example_refresh_token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              example:
                success: true
                message: Token refreshed.
                module: auth
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsInRlbmFudElkIjoxfQ.new_access_token
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.new_refresh_token
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user session
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.example_refresh_token
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              example:
                success: true
                message: Logged out.
                module: auth
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              example:
                success: true
                message: Current user.
                module: auth
                data:
                  id: 1
                  name: Jane Doe
                  email: jane.doe@acme-technologies.com
                  tenantId: 1
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send OTP verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, purpose]
              properties:
                destination:
                  type: string
                  example: jane.doe@acme-technologies.com
                purpose:
                  type: string
                  enum: [login, signup, reset_password, mfa, verify_phone, verify_email]
                  example: login
                channel:
                  type: string
                  enum: [email, sms]
                  default: email
                  example: email
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              example:
                success: true
                message: OTP sent.
                module: auth
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, purpose, code]
              properties:
                destination:
                  type: string
                  example: jane.doe@acme-technologies.com
                purpose:
                  type: string
                  example: login
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '492810'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              example:
                success: true
                message: OTP verified.
                module: auth
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Enroll new MFA factor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [totp, sms, email, webauthn]
                  example: totp
      responses:
        '201':
          description: MFA factor created
          content:
            application/json:
              example:
                success: true
                message: MFA factor created.
                module: auth
                data:
                  id: 1
                  type: totp
                  secret: 4f9d8a3e7b1c2d3e4f5a6b7c8d9e0f1a
                  isVerified: false
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA factor enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factorId, code]
              properties:
                factorId:
                  type: integer
                  example: 1
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '123456'
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              example:
                success: true
                message: MFA verified.
                module: auth
                data:
                  id: 1
                  type: totp
                  isVerified: true
                  isPrimary: true
                timestamp: '2026-07-25 20:30:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /auth/devices:
    get:
      tags: [Auth]
      summary: List active logged-in devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Devices fetched
          content:
            application/json:
              example:
                success: true
                message: Devices fetched.
                module: auth
                data:
                  - id: 1
                    name: Jane's MacBook Pro
                    platform: macOS 14.5
                    lastIpAddress: 192.168.1.10
                    isTrusted: true
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /auth/devices/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a registered device
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              example:
                success: true
                message: Device revoked.
                module: auth
                timestamp: '2026-07-25 20:30:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
