tags:
  - name: Notifications
    description: Multi-channel notification dispatch and log management

paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List notification logs (paginated)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications fetched.

  /notifications/send:
    post:
      tags: [Notifications]
      summary: Dispatch notification across channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, to, body]
              properties:
                userId: { type: integer }
                channel: { type: string, enum: [email, sms, push, whatsapp, slack, teams, discord, webhook] }
                to: { type: string }
                templateKey: { type: string }
                title: { type: string }
                body: { type: string }
                data: { type: object }
      responses:
        '201':
          description: Notification dispatched.

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Marked as read.
