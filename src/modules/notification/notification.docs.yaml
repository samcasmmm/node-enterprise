tags:
  - name: Notifications
    description: Multi-channel notification dispatch and log management

paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List notification logs (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Notifications fetched
          content:
            application/json:
              example:
                success: true
                message: Notifications fetched.
                module: notification
                data:
                  - id: 1
                    userId: 1
                    channel: email
                    title: Welcome to Enterprise ERP
                    body: Your account has been activated.
                    status: sent
                    sentAt: '2026-07-25T20:18:00.000Z'
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
                timestamp: '2026-07-25 20:18:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

  /notifications/send:
    post:
      tags: [Notifications]
      summary: Dispatch notification across channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, to, body]
              properties:
                userId:
                  type: integer
                  example: 1
                channel:
                  type: string
                  enum: [email, sms, push, whatsapp, slack, teams, discord, webhook]
                  example: email
                to:
                  type: string
                  example: john.doe@acme-enterprise.com
                templateKey:
                  type: string
                  example: welcome_email
                title:
                  type: string
                  example: Welcome to Enterprise ERP
                body:
                  type: string
                  example: Hello {{name}}, welcome to our platform!
                data:
                  type: object
                  example:
                    name: John Doe
      responses:
        '201':
          description: Notification dispatched
          content:
            application/json:
              example:
                success: true
                message: Notification dispatched.
                module: notification
                data:
                  id: 2
                  channel: email
                  to: john.doe@acme-enterprise.com
                  status: queued
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              example:
                success: true
                message: Marked as read.
                module: notification
                timestamp: '2026-07-25 20:18:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
