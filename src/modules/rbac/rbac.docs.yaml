tags:
  - name: RBAC - Roles
    description: Role-based access control — roles & permission assignment
  - name: RBAC - Permissions
    description: Permission definitions

paths:
  /rbac/roles:
    get:
      tags: [RBAC - Roles]
      summary: List all roles (paginated)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles fetched.
    post:
      tags: [RBAC - Roles]
      summary: Create role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Role created.

  /rbac/roles/{id}:
    get:
      tags: [RBAC - Roles]
      summary: Get role by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Role details.
    patch:
      tags: [RBAC - Roles]
      summary: Update role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Role updated.
    delete:
      tags: [RBAC - Roles]
      summary: Delete role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Role deleted.

  /rbac/roles/{id}/permissions:
    put:
      tags: [RBAC - Roles]
      summary: Set permissions for role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Permissions set.

  /rbac/roles/{id}/assign:
    post:
      tags: [RBAC - Roles]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer }
                branchId: { type: integer }
                departmentId: { type: integer }
      responses:
        '201':
          description: Role assigned.

  /rbac/permissions:
    get:
      tags: [RBAC - Permissions]
      summary: List all permissions (paginated)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissions fetched.
