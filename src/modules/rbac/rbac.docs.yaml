tags:
  - name: RBAC - Roles
    description: Role-based access control — roles & permission assignment
  - name: RBAC - Permissions
    description: Permission definitions

paths:
  /rbac/roles:
    get:
      tags: [RBAC - Roles]
      summary: List all roles (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Roles fetched
          content:
            application/json:
              example:
                success: true
                message: Roles fetched.
                module: role
                data:
                  - id: 1
                    name: Administrator
                    description: Full platform administrative control
                  - id: 2
                    name: HR Manager
                    description: HRMS sub-system manager
                meta:
                  page: 1
                  limit: 20
                  total: 2
                  totalPages: 1
                timestamp: '2026-07-25 20:18:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

    post:
      tags: [RBAC - Roles]
      summary: Create new role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Sales Manager
                description:
                  type: string
                  example: CRM & Sales pipeline access
      responses:
        '201':
          description: Role created
          content:
            application/json:
              example:
                success: true
                message: Role created.
                module: role
                data:
                  id: 3
                  name: Sales Manager
                  description: CRM & Sales pipeline access
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /rbac/roles/{id}:
    get:
      tags: [RBAC - Roles]
      summary: Get role by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Role details
          content:
            application/json:
              example:
                success: true
                message: Role fetched.
                module: role
                data:
                  id: 1
                  name: Administrator
                timestamp: '2026-07-25 20:18:00'
        '404':
          $ref: '#/components/responses/404NotFoundError'

    patch:
      tags: [RBAC - Roles]
      summary: Update role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Senior HR Manager
                description:
                  type: string
                  example: Full HRMS & Payroll approval control
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              example:
                success: true
                message: Role updated.
                module: role
                data:
                  id: 2
                  name: Senior HR Manager
                timestamp: '2026-07-25 20:18:00'

    delete:
      tags: [RBAC - Roles]
      summary: Delete role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              example:
                success: true
                message: Role deleted.
                module: role
                timestamp: '2026-07-25 20:18:00'

  /rbac/roles/{id}/permissions:
    put:
      tags: [RBAC - Roles]
      summary: Set permissions for role (replaces existing grants)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 5, 8]
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              example:
                success: true
                message: Permissions updated.
                module: role
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /rbac/roles/{id}/assign:
    post:
      tags: [RBAC - Roles]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
                  example: 1
                branchId:
                  type: integer
                  example: 1
                departmentId:
                  type: integer
                  example: 2
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              example:
                success: true
                message: Role assigned.
                module: role
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /rbac/permissions:
    get:
      tags: [RBAC - Permissions]
      summary: List all available permissions (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Permissions fetched
          content:
            application/json:
              example:
                success: true
                message: Permissions fetched.
                module: permission
                data:
                  - id: 1
                    key: user:create
                    name: Create User
                  - id: 2
                    key: user:read
                    name: View User
                meta:
                  page: 1
                  limit: 20
                  total: 2
                  totalPages: 1
                timestamp: '2026-07-25 20:18:00'
