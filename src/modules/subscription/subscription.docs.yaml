tags:
  - name: Subscription
    description: Subscription plans, purchases, and module access grants

paths:
  /subscription/plans:
    get:
      tags: [Subscription]
      summary: List subscription plans (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Plans fetched
          content:
            application/json:
              example:
                success: true
                message: Plans fetched.
                module: subscription
                data:
                  - id: 1
                    name: Professional
                    code: pro
                    price: '99.00'
                    currency: USD
                    billingCycle: monthly
                    moduleKeys: [hrms, crm]
                    trialDays: 14
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
                timestamp: '2026-07-25 20:18:00'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'

    post:
      tags: [Subscription]
      summary: Create plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, price]
              properties:
                name:
                  type: string
                  example: Enterprise Suite
                code:
                  type: string
                  example: enterprise-suite
                price:
                  type: string
                  example: '299.00'
                currency:
                  type: string
                  default: USD
                  example: USD
                billingCycle:
                  type: string
                  enum: [monthly, yearly]
                  default: monthly
                  example: yearly
                moduleKeys:
                  type: array
                  items: { type: string }
                  example: [hrms, crm, inventory, accounting]
                trialDays:
                  type: integer
                  example: 30
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              example:
                success: true
                message: Plan created.
                module: subscription
                data:
                  id: 2
                  name: Enterprise Suite
                  code: enterprise-suite
                  price: '299.00'
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /subscription/purchase:
    post:
      tags: [Subscription]
      summary: Purchase subscription plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Plan purchased and module access activated
          content:
            application/json:
              example:
                success: true
                message: Plan purchased.
                module: subscription
                data:
                  id: 1
                  tenantId: 1
                  planId: 1
                  status: active
                  currentPeriodEnd: '2026-08-25T20:18:00.000Z'
                timestamp: '2026-07-25 20:18:00'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '404':
          $ref: '#/components/responses/404NotFoundError'

  /subscription/cancel:
    post:
      tags: [Subscription]
      summary: Cancel active subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              example:
                success: true
                message: Subscription cancelled.
                module: subscription
                timestamp: '2026-07-25 20:18:00'
        '404':
          $ref: '#/components/responses/404NotFoundError'
